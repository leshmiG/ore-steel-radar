name: Backfill history

# One-off: search every source over the last N days (default 120 = 4 months) in two-week windows,
# analyse what is found, rebuild the dashboard and commit. Run it once from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to search"
        default: "120"
      max_items:
        description: "Most headlines to analyse (cost cap)"
        default: "4000"

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backfill
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RADAR_COMPANY_PROFILE: ${{ secrets.RADAR_COMPANY_PROFILE }}
        run: |
          python radar.py markets
          python radar.py backfill --days "${{ inputs.days }}" --max "${{ inputs.max_items }}"
      - name: Save results
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -f data/radar.db data/markets.json docs
          git diff --cached --quiet || git commit -m "Backfill ${{ inputs.days }} days of history"
          git pull --rebase origin main || true
          git push
