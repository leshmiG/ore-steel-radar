# Ore & Steel Radar - configuration
# Fully automatic: no company details needed. Edit lists here; no code changes required.

# Perspective used for the "so what". Generic by default; optional override via the
# RADAR_COMPANY_PROFILE environment variable / GitHub secret.
perspective: >
  A typical iron ore pellet producer and steelmaker based in the GCC: buys iron ore
  concentrate and fines by sea, produces DR-grade and BF-grade pellets, runs DRI and
  electric arc furnace steelmaking, and sells pellets and steel into the GCC, MENA,
  India, Europe and Asia.

leaders:
  CEO: "Strategy, capacity, M&A, partnerships, market entry"
  CFO: "Margins, costs, prices, FX, capex, financing, peer results, financial risk"
  CTO: "Operations for pelletizing and steelmaking: process, quality, energy, reliability, safety"
  SMO: "Sales and marketing: pellet and steel pricing, customers, markets"
  CPO: "Procurement: iron ore, gas, freight, refractories, electrodes, supplier risk"

watch_areas:
  - Markets and prices
  - Supply and demand
  - Technology and process
  - Policy and regulation
  - Customers and end markets
  - Suppliers and logistics
  - Research and innovation
  - Macro and geopolitics
  - Competitors

regions:
  - GCC and Middle East
  - China
  - India
  - Asia Pacific
  - Europe
  - CIS
  - North America
  - South America
  - Africa
  - Global

