# Ore & Steel Radar - configuration
# Fully automatic: no company details needed. Edit lists here; no code changes required.

# Perspective used for the "so what". Generic by default; optional override via the
# RADAR_COMPANY_PROFILE environment variable / GitHub secret.
perspective: >
  A typical iron ore pellet producer and steelmaker based in the GCC: buys iron ore
  concentrate and fines by sea, produces DR-grade and BF-grade pellets, runs DRI and
  electric arc furnace steelmaking, and sells pellets and steel into the GCC, MENA,
  India, Europe and Asia.

# Dashboard tabs: every signal is routed to the functions whose decisions it could change
functions:
  GOV: {name: "Governance & Strategy", remit: "Strategy, capacity, M&A, partnerships, market entry, policy, CBAM and ESG"}
  FIN: {name: "Finance & Risk", remit: "Prices, margins, costs, FX, capex, financing, peer results, market and geopolitical risk"}
  SCM: {name: "Supply Chain", remit: "Iron ore and raw materials, freight, ports, shipping routes incl. the Strait of Hormuz, suppliers, customers' deliveries"}
  INN: {name: "Innovation & Research", remit: "Pelletizing and steelmaking process, DRI and hydrogen, green steel, digital and AI, research and patents"}

# Hashtags the AI tags each signal with (it may add a new one when a theme is clearly emerging)
hashtags: ["#IronOre", "#Pellets", "#DRGradePellets", "#DRI", "#HBI", "#Steel", "#SteelPrices", "#GreenSteel", "#HydrogenDRI",
  "#EAF", "#Scrap", "#CokingCoal", "#ChinaSteel", "#IndiaSteel", "#GCCSteel", "#StraitOfHormuz", "#Shipping", "#Freight",
  "#CBAM", "#Tariffs", "#Simandou", "#Mining", "#Earnings", "#Capacity", "#Energy", "#Geopolitics"]
pinned_hashtags: ["#StraitOfHormuz"]   # always shown in the Top 10 panel

watch_areas:
  - Markets and prices
  - Supply and demand
  - Technology and process
  - Policy and regulation
  - Customers and end markets
  - Suppliers and logistics
  - Research and innovation
