# Market data (free, no API key). Fetched each run; the dashboard hides the panel if a source is unavailable.
markets:
  commodities:      # FRED CSV series (IMF and BLS data)
    - {id: PIORECRUSDM, name: Iron ore, unit: "$/t", note: "Global price, monthly (IMF)"}
    - {id: PCOALAUUSDM, name: Coal (Australia), unit: "$/t", note: "Monthly (IMF)"}
    - {id: PNGASEUUSDM, name: Natural gas (Europe), unit: "$/MMBtu", note: "Monthly (IMF)"}
    - {id: WPU101, name: US iron & steel PPI, unit: "index", note: "Producer price index, monthly (BLS)"}
    - {id: DCOILBRENTEU, name: Brent crude, unit: "$/bbl", note: "Daily (EIA)"}
  equities:         # Stooq daily closes, US listings
    - {symbol: vale.us, name: Vale}
    - {symbol: rio.us, name: Rio Tinto}
    - {symbol: bhp.us, name: BHP}
    - {symbol: mt.us, name: ArcelorMittal}
    - {symbol: nue.us, name: Nucor}
    - {symbol: stld.us, name: Steel Dynamics}
    - {symbol: clf.us, name: Cleveland-Cliffs}
    - {symbol: pkx.us, name: POSCO}
    - {symbol: tx.us, name: Ternium}
    - {symbol: ggb.us, name: Gerdau}

# Extra RSS feeds (check each site's terms before automating)
feeds:
  - https://www.mining.com/feed/
  - https://www.hellenicshippingnews.com/feed/

settings:
  lookback: 2d                 # Google News window per run
  llm_provider: anthropic      # anthropic | bedrock | none
  model: claude-sonnet-5       # analysis model (Anthropic API ID)
  triage_model: claude-haiku-4-5-20251001   # cheap first-pass relevance filter; "" to skip
  bedrock_model: ""            # Bedrock model or inference profile ID, if llm_provider is bedrock
  bedrock_triage_model: ""
  aws_region: us-east-1
  batch_size: 10               # headlines per analysis call
  triage_batch_size: 40        # headlines per triage call
  max_items_per_run: 500       # cost guard
  min_impact_for_brief: 5
  alert_impact: 8
  report_days: 7               # default dashboard window (days)
  history_days: 90             # days kept for the date filter
  db_path: data/radar.db
  output_dir: docs             # GitHub Pages serves this folder
