# Strait of Hormuz watch: daily transits from IMF PortWatch (chokepoint6), plus vessels holding offshore,
# war-risk insurance and incidents from the Straits.live OSINT aggregator. Baseline = median daily transits
# over the pre-crisis window below.
hormuz:
  chokepoint: chokepoint6
  baseline_from: "2025-02-28"
  baseline_to: "2026-02-27"
  chart_days: 180

